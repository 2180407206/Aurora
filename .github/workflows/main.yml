name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 必须使用 JDK 11，因为你的 Gradle 7.0.2 不兼容 JDK 17
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. 配置 Android SDK，添加 SKIP_JDK_VERSION_CHECK 绕过新版工具的强制 JDK 17 检查
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      # 3. 如果你依然是通过上传 Aurora.zip 来管理项目，保留这一步
      #    （强烈建议后续直接上传源码，不用再解压）
      - name: Unzip Project
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      # 4. 直接使用你本地改好的 Gradle 文件进行编译
      - name: Build with Gradle
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          # 直接编译，不再有任何 cat > 覆盖操作
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 5. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
