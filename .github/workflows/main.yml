name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      - name: Fix Gradle Files and Build
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ 项目目录: $PROJ_DIR"
          cd "$PROJ_DIR"
          
          # -------------------------------------------------
          # 🚀 关键步骤：强制覆盖有问题的 gradle 配置文件
          # -------------------------------------------------
          
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '7.0.1' apply false
              id 'com.android.library' version '7.0.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.5.21' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > settings.gradle << 'EOF'
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Aurora"
          include ':app'
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              compileSdk 31
              defaultConfig {
                  applicationId "com.Aurora"
                  minSdk 21
                  targetSdk 31
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.3.1'
              implementation 'com.google.android.material:material:1.4.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
              implementation 'androidx.recyclerview:recyclerview:1.2.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
              implementation 'com.squareup.retrofit2:retrofit:2.9.0'
              implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
              implementation 'com.squareup.okhttp3:okhttp:4.9.3'
              implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
              implementation 'com.google.code.gson:gson:2.10'
          }
          EOF
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
