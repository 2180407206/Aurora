name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键一步：在服务器上安装配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip Project
        run: unzip Aurora.zip

      - name: Build APK
        run: |
          # 找到 gradlew 所在目录（兼容解压后有外层文件夹的情况）
          PROJ_DIR=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          echo "项目目录是: $PROJ_DIR"
          cd "$PROJ_DIR"
          
          # 在服务器上自动创建 local.properties，指向刚安装的 SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          chmod +x gradlew
          # 执行编译，忽略测试加快速度
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
