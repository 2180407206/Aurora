name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # 关键点：使用 ubuntu-20.04，它的预装 SDK 版本较旧，完美兼容 AGP 7.0.1
    runs-on: ubuntu-20.04
    
    steps:
      - uses: actions/checkout@v4

      # 1. 只需要 JDK 11，满足 Gradle 7.0.1 的要求
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. 解压项目（如果你后面准备直接用源码，这一步可以删掉）
      - name: Unzip Project
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      # 3. 直接开始构建，使用系统预装的 Android SDK
      - name: Build with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          echo "=== 开始编译 ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 4. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
