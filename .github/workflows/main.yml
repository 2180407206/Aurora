name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip and Check
        run: |
          echo "=== 当前目录文件列表 ==="
          ls -la
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      - name: Find and Build
        run: |
          echo "=== 查找 gradlew 文件 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 错误：在解压后的文件中找不到 gradlew 文件！"
            echo "请检查你的 Aurora.zip 里是否包含完整的项目文件，或者检查是否上传了正确的 zip 包。"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ 找到项目目录: $PROJ_DIR"
          cd "$PROJ_DIR"
          
          # 告诉 Android 编译器 SDK 的位置
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # 赋予运行权限并开始编译
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
