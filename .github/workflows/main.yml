name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 删除那个会报错的 setup-android，直接用系统自带的
      - name: Unzip and Check
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      - name: Find and Build
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ 找到项目目录: $PROJ_DIR"
          cd "$PROJ_DIR"
          
          # 关键点：使用服务器系统自带的 Android SDK
          # GitHub 的 ubuntu-latest 默认就有 ANDROID_HOME 环境变量
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "当前使用的 SDK 目录: $ANDROID_HOME"
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
