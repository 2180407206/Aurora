name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 只需要 JDK 11，满足 Gradle 7.0.1 的要求
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. 如果你依然用 Aurora.zip 传源码，保留这一步
      - name: Unzip Project
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      # 3. 直接开始构建，使用 GitHub 预装的 Android SDK
      - name: Build with Gradle
        env:
          # 显式告诉 Gradle SDK 的路径（GitHub Runner 默认就在这）
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          echo "=== 开始编译 ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 4. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
