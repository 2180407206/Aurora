name: Build Aurora APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 先装 JDK 17，专门用来运行 Android SDK 工具
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 配置 Android SDK（现在用的是 JDK 17，不会再报错）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 3. 切回 JDK 11，专门用来执行 Gradle 构建
      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 4. 解压项目（如果你后面打算直接用源码，可以删掉这一步）
      - name: Unzip Project
        run: |
          echo "=== 开始解压 ==="
          unzip -o Aurora.zip

      # 5. 执行构建
      - name: Build with Gradle
        run: |
          echo "=== 查找项目目录 ==="
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ 找不到 gradlew 文件！"
            exit 1
          fi
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
